<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F0E6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="店務本">
<meta name="robots" content="noindex, nofollow">
<title>慢餉店務本</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&family=DM+Sans:wght@500;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
/* 木桌手帳：羊皮紙底、核桃棕標題、森林綠行動色；標題置中，卡片統一 14px 內距 */
:root{
  --ground:#F6F0E6; --paper:#FFFDF9; --line:#E8D9C5; --line2:#D9C4A3;
  --ink:#3b2f22; --walnut:#5c4329; --muted:#6f5a42; --soft:#8a6d4c;
  --forest:#3D6B4A; --forest-d:#2c4f36; --forest-l:#e6efe6;
  --gold:#E9C27A; --gold-l:#f7ead0; --rust:#9a4a1c; --rust-l:#f8e6d8;
  --serif:'Noto Serif TC','Songti TC',serif; --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; --num:'DM Sans',var(--sans);
  --r:14px; color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);-webkit-text-size-adjust:100%;}
body{min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--forest);outline-offset:2px;border-radius:8px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));}
.hd{padding-top:calc(26px + env(safe-area-inset-top,0px));padding-bottom:10px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.eyebrow{font-size:12px;letter-spacing:3px;color:var(--soft)}
h1{margin:0;font-family:var(--serif);font-size:28px;color:var(--walnut);letter-spacing:2px;text-wrap:balance}
.sub{font-size:13px;color:var(--muted)}
h2{margin:0;font-family:var(--serif);font-size:17px;color:var(--walnut);letter-spacing:1px}
.sec{display:flex;flex-direction:column;gap:8px;margin-top:20px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sec-h small{font-size:12px;color:var(--soft)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.prog{margin-top:14px;width:100%;display:flex;align-items:center;gap:14px;text-align:left}
.prog b{font-size:15px;color:var(--forest)}
.prog span{font-size:12px;color:var(--muted)}
.row{display:flex;align-items:center;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px 11px 14px;min-height:58px}
.row.open{border-style:dashed;border-color:var(--line2)}
.row.wide{flex-wrap:wrap;row-gap:10px;align-items:flex-start}
.row.wide .mk{margin-top:1px}
.row.wide .acts{width:100%;justify-content:flex-end;padding-left:36px}
.row .mk{flex:none;width:24px;height:24px;display:flex;align-items:center;justify-content:center}
.row .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .t{font-size:14.5px;line-height:1.4;word-break:break-word}
.row .m{font-size:12px;color:var(--muted);line-height:1.5}
.row .m.ok{color:var(--forest)}
.row .note{font-size:12px;color:var(--walnut);background:var(--gold-l);border-radius:8px;padding:5px 9px;margin-top:4px;align-self:flex-start;word-break:break-word}
.acts{flex:none;display:flex;gap:6px}
.btn{border:0;border-radius:999px;padding:0 15px;height:36px;font-size:13.5px;font-weight:700;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.pri{background:var(--forest);color:#fff}
.btn.pri:hover{background:var(--forest-d)}
.btn.ghost{background:transparent;color:var(--forest);border:1.5px solid #b9cfbd}
.btn.soft{background:var(--forest-l);color:var(--forest)}
.btn.warn{background:transparent;color:var(--rust);border:1.5px solid #e6c2a8}
.btn.full{width:100%;height:46px;font-size:15px}
.btn[disabled]{opacity:.55;cursor:default}
.linkbtn{background:none;border:0;color:var(--forest);font-weight:700;font-size:13px;padding:6px 2px}
.tcard{display:flex;flex-direction:column;gap:6px}
.tcard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.tcard .top b{font-size:14.5px;line-height:1.45;word-break:break-word}
.tcard .meta{font-size:12px;color:var(--muted);line-height:1.6}
.tcard.done{border-color:#bcd3c0;background:#f7fbf6}
.tcard .who-done{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;color:var(--forest)}
.remind{border:1.5px solid #e2c48c;background:#fffaf0}
.remind .rh{display:flex;align-items:center;gap:10px}
.remind .rh b{font-size:15px;color:var(--walnut)}
.remind .rs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.allok{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--forest);font-weight:700}
.tcard .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:2px}
.chip{flex:none;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.chip.due{color:var(--rust);background:var(--rust-l)}
.chip.calm{color:var(--soft);background:#f1e8da}
.chip.ok{color:var(--forest);background:var(--forest-l)}
.chip.who{color:var(--walnut);background:var(--gold-l)}
/* 注意事項 */
.ncard{display:flex;flex-direction:column;gap:7px}
.ncard .nhd{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ncard .nt{font-size:15px;line-height:1.45;word-break:break-word}
.ncard .nb{font-size:13.5px;line-height:1.75;color:var(--ink);white-space:pre-line;word-break:break-word}
.ncard.clip .nb{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ncard .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:2px}
.ncard .by{font-size:12px;color:var(--muted)}
.ncard.unread{border-color:#e2c48c;box-shadow:0 0 0 3px var(--gold-l)}
.chip.c-q{color:var(--rust);background:var(--rust-l)} .chip.c-f{color:#8a2f2f;background:#f6e0dc} .chip.c-p{color:var(--forest);background:var(--forest-l)} .chip.c-e{color:var(--walnut);background:#efe3cf} .chip.c-g{color:var(--soft);background:#f1e8da}
.pin{font-size:11.5px;font-weight:700;color:var(--soft)}
.seen{font-size:12.5px;color:var(--forest);font-weight:700;background:none;border:0;padding:6px 2px}
.chk{display:flex;align-items:center;gap:10px;font-size:14px;min-height:44px;margin-bottom:6px}
.chk input{width:20px;height:20px;accent-color:var(--forest)}
.namelist{display:flex;flex-wrap:wrap;gap:6px}
/* 開店準備 */
.openhero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:22px 16px 18px;background:linear-gradient(180deg,#fffaf0,#fffdf9);border:1.5px solid #e9d3a8}
.openhero .sun{width:46px;height:46px;border-radius:50%;background:var(--gold-l);display:flex;align-items:center;justify-content:center;color:#c99a3f;margin-bottom:2px}
.openhero .oh-t{font-family:var(--serif);font-size:19px;color:var(--walnut);letter-spacing:1px}
.openhero .oh-s{font-size:13px;color:var(--muted);line-height:1.6}
.btn.big{height:52px;padding:0 34px;font-size:17px;letter-spacing:2px;margin-top:8px;box-shadow:0 10px 22px -12px rgba(61,107,74,.8)}
.opened{display:flex;align-items:center;gap:12px}
.opened .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.opened .tx b{font-size:14.5px;color:var(--forest)}
.opened .tx span{font-size:12.5px;color:var(--muted)}
.flow{position:fixed;inset:0;z-index:50;background:var(--ground);overflow:auto;-webkit-overflow-scrolling:touch}
.flow .fx{position:sticky;top:0;z-index:2;background:rgba(246,240,230,.96);backdrop-filter:blur(6px);padding-top:env(safe-area-inset-top,0px)}
.flow .fx .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:6px max(10px,env(safe-area-inset-left,0px)) 6px max(10px,env(safe-area-inset-right,0px))}
.flow .fx .ttl{text-align:center;font-family:var(--serif);font-size:16px;color:var(--walnut);letter-spacing:1px}
.flow .bar{height:5px;background:var(--line);border-radius:999px;overflow:hidden;margin:2px 0 0}
.flow .bar i{display:block;height:100%;background:var(--forest);border-radius:999px;transition:width .3s}
.fgrp{display:flex;flex-direction:column;gap:8px;margin-top:20px}
.fgrp h2{display:flex;justify-content:space-between;align-items:baseline}
.fgrp h2 small{font-family:var(--sans);font-size:12px;color:var(--soft);letter-spacing:0}
.fitem{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;min-height:54px;font-size:14.5px;line-height:1.6;color:var(--ink)}
.fitem .ck{flex:none;width:24px;height:24px;margin-top:1px;border-radius:50%;border:1.8px solid #C9AE88;display:flex;align-items:center;justify-content:center}
.fitem.on{background:#f7fbf6;border-color:#bcd3c0;color:var(--muted)}
.fitem.on .ck{background:var(--forest);border-color:var(--forest)}
.fitem small{display:block;font-size:12px;color:var(--soft);margin-top:2px}
.ftip{display:flex;gap:10px;align-items:flex-start;background:var(--gold-l);border-radius:var(--r);padding:12px 14px;font-size:13.5px;line-height:1.7;color:var(--walnut);margin-top:12px}
.ftip svg{flex:none;margin-top:3px}
.flow .fend{position:sticky;bottom:0;background:linear-gradient(180deg,rgba(246,240,230,0),var(--ground) 30%);padding:26px 0 calc(16px + env(safe-area-inset-bottom,0px));margin-top:10px}
.flow .confirm{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;text-align:center;font-size:14px;color:var(--walnut)}
.cele{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:40px 24px}
.cele .cele-t{font-family:var(--serif);font-size:40px;color:var(--forest);letter-spacing:6px}
.cele p{margin:0;font-size:15px;color:var(--muted);line-height:1.8}
.sops{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sops button{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:14.5px;font-weight:700;color:var(--walnut)}
.sops button span{font-size:11.5px;font-weight:500;color:var(--soft)}
.sopl{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.7}
.empty{text-align:center;font-size:13px;color:var(--soft);padding:18px 10px;border:1px dashed var(--line2);border-radius:var(--r)}
.trail{display:flex;flex-direction:column}
.trail .it{display:grid;grid-template-columns:48px 14px minmax(0,1fr);column-gap:10px;align-items:start}
.trail .tm{font-family:var(--num);font-size:12.5px;color:var(--soft);padding-top:1px;font-variant-numeric:tabular-nums}
.trail .dot{display:flex;flex-direction:column;align-items:center;height:100%}
.trail .dot i{width:9px;height:9px;border-radius:50%;background:var(--forest);margin-top:5px}
.trail .dot u{flex:1;width:1.5px;background:var(--line);margin-top:3px;min-height:14px}
.trail .ds{font-size:13.5px;padding-bottom:12px;line-height:1.5;word-break:break-word}
.trail .ds em{font-style:normal;color:var(--muted);font-size:12px}
.seg{display:flex;background:#efe5d4;border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;height:36px;font-size:13.5px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--paper);color:var(--forest);box-shadow:0 1px 3px rgba(92,67,41,.12)}
/* 行事曆 */
.cal{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:10px 8px 12px}
.cal-h{display:flex;align-items:center;justify-content:center;gap:16px}
.icon-btn{width:44px;height:44px;border:0;background:transparent;border-radius:50%;color:var(--soft);display:flex;align-items:center;justify-content:center}
.icon-btn:hover{background:#f1e8da}
.wk,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.wk span{text-align:center;font-size:11.5px;color:var(--soft);padding:4px 0}
.dcell{border:0;background:transparent;height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0}
.dcell .n{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--num);font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums}
.dcell.out .n{color:#c9b89e}
.dcell.today .n{background:var(--forest);color:#fff;font-weight:700}
.dcell.sel .n{box-shadow:inset 0 0 0 2px #B8906A;font-weight:700;color:var(--walnut)}
.dcell.today.sel .n{box-shadow:inset 0 0 0 2px var(--gold);color:#fff}
.dcell .ds{display:flex;gap:3px;height:6px}
.dcell .ds i{width:6px;height:6px;border-radius:50%}
.i-ok{background:var(--forest)} .i-due{background:#C2601F} .i-ev{background:#B8906A}
.legend{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 14px;font-size:11px;color:var(--muted);padding-top:8px}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:7px;height:7px;border-radius:50%}
.ev{display:flex;gap:12px;align-items:flex-start}
.ev .tm{flex:none;width:48px;font-family:var(--num);font-size:13px;color:var(--soft);padding-top:1px}
.ev .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ev b{font-size:14.5px;word-break:break-word}
.ev small{font-size:12px;color:var(--muted);word-break:break-word}
/* 我的 */
.me-card{display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px 14px}
.avatar{width:58px;height:58px;border-radius:50%;background:var(--forest);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:24px}
.menu{display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.menu button{display:flex;justify-content:space-between;align-items:center;border:0;background:transparent;text-align:left;padding:0 14px;min-height:52px;font-size:14.5px;border-top:1px solid var(--line)}
.menu button:first-child{border-top:0}
.menu button span{font-size:12px;color:var(--soft)}
.thanks{text-align:center;display:flex;flex-direction:column;gap:4px;padding:18px 14px;background:linear-gradient(180deg,#fffaf0,#fffdf9);border:1.5px solid #e9d3a8}
.thanks b{font-family:var(--serif);font-size:18px;color:var(--walnut)}
.thanks .num{font-family:var(--num);font-size:34px;font-weight:700;color:var(--forest);line-height:1.2}
.thanks span{font-size:13px;color:var(--muted);line-height:1.6}
.sig{text-align:center;font-size:11px;color:#b9a689;letter-spacing:1.5px;margin:28px 0 8px}
/* 底部導覽 */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,253,249,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
nav.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--soft);min-height:52px;justify-content:center;position:relative}
nav.tabs button.on{color:var(--forest);font-weight:700}
nav.tabs .badge{position:absolute;top:4px;left:calc(50% + 8px);min-width:17px;height:17px;padding:0 5px;border-radius:999px;background:#C2601F;color:#fff;font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:var(--num)}
/* 抽屜 */
.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(43,32,20,.38);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--paper);border-radius:22px 22px 0 0;padding:10px max(18px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px));box-shadow:0 -10px 30px -12px rgba(43,32,20,.35)}
.sheet .grab{width:40px;height:4px;border-radius:999px;background:var(--line2);margin:0 auto 12px}
.sheet h3{margin:0 0 4px;text-align:center;font-family:var(--serif);font-size:19px;color:var(--walnut)}
.sheet .lead{text-align:center;font-size:13px;color:var(--muted);margin:0 0 14px;line-height:1.6}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.fld label{font-size:12.5px;font-weight:700;color:var(--muted)}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line2);background:#fff;border-radius:12px;padding:11px 13px;font-size:15px;min-height:46px}
.fld textarea{min-height:84px;resize:vertical;line-height:1.6}
.fld .hint{font-size:11.5px;color:var(--soft)}
.stack{display:flex;flex-direction:column;gap:8px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.err{color:var(--rust);font-size:13px;text-align:center;min-height:18px;margin:4px 0 8px}
.copybox{background:var(--forest-l);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.9;word-break:break-all;user-select:all}
/* 登入 */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px max(18px,env(safe-area-inset-left,0px));}
.login .box{width:100%;max-width:380px;background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:28px 22px 22px;box-shadow:0 24px 50px -30px rgba(92,67,41,.5)}
.login .logo{width:68px;height:68px;border-radius:18px;display:block;margin:0 auto 12px}
.toast{position:fixed;left:50%;bottom:calc(98px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--walnut);color:#fff;font-size:13.5px;padding:10px 18px;border-radius:999px;box-shadow:0 10px 24px -12px rgba(43,32,20,.6);max-width:calc(100vw - 40px);text-align:center;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
.loading{text-align:center;color:var(--soft);font-size:13px;padding:40px 0}
.faded{opacity:.5}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"><div class="loading">載入中…</div></div>
<nav class="tabs" id="tabs" hidden>
  <div class="in">

    acts=mine?'<div class="acts"><button type="button" class="btn ghost" data-act="t-release" data-id="'+t.id+'">請人幫看</button><button type="button" class="btn pri" data-act="t-done" data-id="'+t.id+'">我完成了</button></div>':'<div class="acts"><button type="button" class="btn soft" data-act="t-done" data-id="'+t.id+'">我幫忙完成</button></div>';

function trailItems(logs,tasks){
  var it=[];
  logs.forEach(function(l){if(!l.done_at)return;var r=S.routines.find(function(x){return x.id===l.routine_id;});it.push({ts:l.done_at,who:l.done_by,what:r?r.title:'例行事項',note:l.note});});
  tasks.forEach(function(t){if(!t.done_at)return;it.push({ts:t.done_at,who:t.done_by,what:t.title,note:t.note,task:true});});
  it.sort(function(a,b){return new Date(a.ts)-new Date(b.ts);});
  return it;
}
function trailHtml(it){
  if(!it.length)return '<div class="empty">這天還沒有足跡</div>';
  return '<div class="card"><div class="trail">'+it.map(function(x,i){return '<div class="it"><span class="tm">'+hm(x.ts)+'</span><span class="dot"><i></i>'+(i<it.length-1?'<u></u>':'')+'</span><div class="ds">'+esc(nm(x.who))+(x.task?' 幫忙完成「'+esc(x.what)+'」':' 完成 '+esc(x.what))+(x.note?'<br><em>'+esc(x.note)+'</em>':'')+'</div></div>';}).join('')+'</div></div>';

function viewCal(){

  var nAct=activeRoutines().length;

  var evBy={};c.events.forEach(function(e){evBy[e.day]=1;});
  var dueBy={};c.tasks.forEach(function(t){if(t.due_date&&!t.done_at)dueBy[t.due_date]=1;});
  var cells='';
  for(var i=0;i<startW;i++)cells+='<span></span>';
  for(var d=1;d<=nDays;d++){
    var ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var cls='dcell'+(ds===S.today?' today':'')+(ds===c.sel?' sel':'');
    var dots=(nAct&&doneBy[ds]>=nAct?'<i class="i-ok"></i>':'')+(dueBy[ds]?'<i class="i-due"></i>':'')+(evBy[ds]?'<i class="i-ev"></i>':'');

  }
  var sel=c.sel;
  var evs=c.events.filter(function(e){return e.day===sel;});
  var dues=c.tasks.filter(function(t){return t.due_date===sel&&!t.done_at;});
  var logs=c.logs.filter(function(l){return l.day===sel;});
  var tdone=c.tasks.filter(function(t){return t.done_at&&tpeDate(new Date(t.done_at))===sel;});
  var h='<header class="hd wrap"><div class="eyebrow" style="font-family:var(--num);letter-spacing:4px">'+y+'</div>'+
    '<div class="cal-h"><button type="button" class="icon-btn" data-mon="-1" aria-label="上個月">'+ICON.left+'</button><h1>'+(m+1)+' 月</h1><button type="button" class="icon-btn" data-mon="1" aria-label="下個月">'+ICON.right+'</button></div></header>'+
    '<main class="wrap"><div class="cal"><div class="wk">'+WD.map(function(w){return '<span>'+w+'</span>';}).join('')+'</div><div class="days">'+cells+'</div>'+
    '<div class="legend"><span><i class="i-ok"></i>例行全部完成</span><span><i class="i-due"></i>待辦的期限</span><span><i class="i-ev"></i>行程</span></div></div>';
  h+='<section class="sec"><div class="sec-h"><h2>'+longDate(sel)+'</h2><button type="button" class="linkbtn" data-act="e-new">＋ 新增行程</button></div>';
  h+=evs.length?evs.map(function(e){var can=e.created_by===S.me.id||canManage();return '<div class="card ev"><span class="tm">'+esc(e.time_text||'全天')+'</span><div class="tx"><b>'+esc(e.title)+'</b>'+(e.note?'<small>'+esc(e.note)+'</small>':'')+'<small>'+esc(nm(e.created_by))+' 新增</small></div>'+(can?'<button type="button" class="linkbtn" data-act="e-del" data-id="'+e.id+'" style="color:var(--soft)">移除</button>':'')+'</div>';}).join(''):'<div class="empty">這天沒有行程</div>';
  h+='</section>';
  if(dues.length)h+='<section class="sec"><div class="sec-h"><h2>這天前要完成的待辦</h2></div>'+dues.map(taskCard).join('')+'</section>';
  if(sel<=S.today)h+='<section class="sec"><div class="sec-h"><h2>這天的足跡</h2><small>'+(logs.length+tdone.length)+' 件</small></div>'+trailHtml(trailItems(logs,tdone))+'</section>';
  return h+'</main>';
}

async function render(){
  document.querySelectorAll('nav.tabs button').forEach(function(b){b.classList.toggle('on',b.dataset.tab===S.tab);b.setAttribute('aria-current',b.dataset.tab===S.tab?'page':'false');});
  var v=S.tab==='today'?viewToday():S.tab==='tasks'?viewTasks():S.tab==='notes'?viewNotes():S.tab==='cal'?viewCal():viewMe();
  $('app').innerHTML=v;
}
async function refresh(){
  var before={};S.tasks.forEach(function(t){if(t.done_at)before[t.id]=1;});var had=S.tasks.length>0;
  try{await loadToday();if(S.tab==='cal')await loadMonth();render();}catch(e){toast(errMsg(e));return;}
  if(had){var fresh=S.tasks.filter(function(t){return t.done_at&&!before[t.id]&&t.done_by!==S.me.id;});
    if(fresh.length)toast(fresh.length===1?nm(fresh[0].done_by)+' 完成了「'+fresh[0].title+'」，謝謝 '+nm(fresh[0].done_by)+'！':fresh.length+' 件待辦剛完成，大家辛苦了');}
}
async function loadMyCount(){
  try{var since=tpeDate(new Date(Date.now()-29*864e5));var sz=new Date(since+'T00:00:00+08:00').toISOString();
    var r=await Promise.all([sb.from('ops_routine_logs').select('id',{count:'exact',head:true}).eq('done_by',S.me.id).gte('day',since),
      sb.from('ops_tasks').select('id',{count:'exact',head:true}).eq('done_by',S.me.id).gte('done_at',sz),
      sb.from('ops_openings').select('day',{count:'exact',head:true}).eq('opened_by',S.me.id).gte('day',since)]);
    S.myCount=(r[0].count||0)+(r[1].count||0)+(r[2].count||0);}catch(e){S.myCount=0;}
  if(S.tab==='me')render();
}
async function go(tab){
  S.tab=tab;window.scrollTo(0,0);
  if(tab==='me'){S.myCount=null;loadMyCount();}
  if(tab==='cal'){if(!S.cal){var t=S.today.split('-');S.cal={y:+t[0],m:+t[1]-1,sel:S.today,logs:[],events:[],tasks:[]};}try{await loadMonth();}catch(e){toast(errMsg(e));}}
  render();
}

async function doOpen(){
  var r=await sb.from('ops_openings').insert({day:S.today});
  if(r.error&&!/duplicate/i.test(r.error.message)){toast(errMsg(r.error));return;}
  try{await loadToday();}catch(e){}
  celebrate();
}
/* ---------- 動作 ---------- */
async function act(kind,id,action,note){
  var fn=kind==='r'?'ops_routine_act':'ops_task_act';
  var args=kind==='r'?{p_routine:id,p_action:action,p_note:note||null}:{p_task:id,p_action:action,p_note:note||null};
  var r=await sb.rpc(fn,args);if(r.error){toast(errMsg(r.error));return false;}
  await refresh();return true;
}
document.addEventListener('click',async function(e){
  var t=e.target.closest('[data-tab],[data-tab-go],[data-act],[data-act2],[data-seg],[data-nseg],[data-day],[data-mon],[data-close],[data-fchk],[data-sop]');if(!t)return;
  if(t.hasAttribute('data-close')){closeSheet();return;}
  if(t.dataset.fchk){var c=getChecks();var k=t.dataset.fchk;c[k]=!c[k];if(!c[k])delete c[k];setChecks(c);renderOpenFlow(false);
    if(c[k]){var gi=+k.split('-')[0],g=SOP.open.groups[gi];var all=g.items.every(function(x,ii){return c[gi+'-'+ii];});
      var everything=SOP.open.groups.every(function(gg,gj){return gg.items.every(function(x,ii){return c[gj+'-'+ii];});});
      toast(everything?'全部準備好了，辛苦啦！按下面開店吧':all?'「'+g.t+'」都準備好了，辛苦啦':warm('check'));}
    return;}
  if(t.dataset.sop){sopView(t.dataset.sop);return;}
  if(t.dataset.tab){go(t.dataset.tab);return;}
  if(t.dataset.tabGo){go(t.dataset.tabGo);return;}
  if(t.dataset.seg){S.taskSeg=t.dataset.seg;render();return;}
  if(t.dataset.nseg){S.noteSeg=t.dataset.nseg;render();return;}
  if(t.dataset.day){S.cal.sel=t.dataset.day;render();return;}
  if(t.dataset.mon){var c=S.cal;c.m+=+t.dataset.mon;if(c.m<0){c.m=11;c.y--;}if(c.m>11){c.m=0;c.y++;}var tp=S.today.split('-');c.sel=(c.y===+tp[0]&&c.m===+tp[1]-1)?S.today:c.y+'-'+String(c.m+1).padStart(2,'0')+'-01';try{await loadMonth();}catch(x){toast(errMsg(x));}render();return;}
  var a=t.dataset.act||t.dataset.act2,id=t.dataset.id;
  if(t.disabled)return;
  switch(a){
    case 'r-claim': t.disabled=true; if(await act('r',id,'claim'))toast(warm('claim')); break;
    case 'r-done': { t.disabled=true; var lg=logOf(id); var hp=lg&&lg.claimed_by&&lg.claimed_by!==S.me.id; if(await act('r',id,'done'))toast(warm(hp?'help':'done')); break; }
    case 'r-release': sheetRelease('r',id); break;
    case 'r-more': sheetRoutineMore(id); break;
    case 'r-undo': closeSheet(); await act('r',id,'undo'); break;
    case 't-claim': t.disabled=true; if(await act('t',id,'claim'))toast(warm('claim')); break;
    case 't-done': { t.disabled=true; var tk=S.tasks.find(function(x){return x.id===id;}); var hp2=tk&&tk.claimed_by&&tk.claimed_by!==S.me.id; if(await act('t',id,'done'))toast(warm(hp2?'help':'done')); break; }
    case 't-release': sheetRelease('t',id); break;
    case 't-more': sheetTaskMore(id); break;
    case 't-undo': closeSheet(); await act('t',id,'undo'); break;
    case 't-del': { var r=await sb.from('ops_tasks').delete().eq('id',id); closeSheet(); if(r.error)toast(errMsg(r.error)); else {toast('已刪除');refresh();} break; }
    case 't-new': sheetNewTask(); break;
    case 'e-new': sheetNewEvent(); break;
    case 'e-del': { var r2=await sb.from('ops_events').delete().eq('id',id); if(r2.error)toast(errMsg(r2.error)); else {toast('已移除');await loadMonth();render();} break; }
    case 'open-flow': renderOpenFlow(false); break;
    case 'flow-close': closeFlow(); break;
    case 'open-back': renderOpenFlow(false); break;
    case 'open-try': if(+t.dataset.left>0)renderOpenFlow(true); else await doOpen(); break;
    case 'open-go': await doOpen(); break;
    case 'n-new': sheetNewNotice(); break;
    case 'n-more': sheetNoticeMore(id); break;
    case 'n-read': { t.disabled=true; var r4=await sb.from('ops_notice_reads').insert({notice_id:id}); if(r4.error&&!/duplicate/i.test(r4.error.message))toast(errMsg(r4.error)); else {toast(warm('read'));refresh();} break; }
    case 'n-pin': { var nn=S.notices.find(function(x){return x.id===id;}); var r5=await sb.from('ops_notices').update({pinned:!nn.pinned}).eq('id',id); closeSheet(); if(r5.error)toast(errMsg(r5.error)); else {toast(nn.pinned?'已取消置頂':'已置頂');refresh();} break; }
    case 'n-hide': { var r6=await sb.from('ops_notices').update({active:false}).eq('id',id); closeSheet(); if(r6.error)toast(errMsg(r6.error)); else {toast('已收起');refresh();} break; }
    case 'pw': sheetPassword(); break;
    case 'users': sheetUsers(); break;
    case 'u-new': sheetUserNew(); break;
    case 'u-edit': sheetUserEdit(id); break;
    case 'routines': sheetRoutines(); break;
    case 'rt-edit': sheetRoutineEdit(id); break;
    case 'rt-up': moveRoutine(id,-1); break;
    case 'rt-down': moveRoutine(id,1); break;
    case 'rt-toggle': { var rr=S.routines.find(function(x){return x.id===id;}); var r3=await sb.from('ops_routines').update({active:!rr.active}).eq('id',id); if(r3.error)toast(errMsg(r3.error)); else {await loadToday();sheetRoutines();render();} break; }
    case 'logout': await sb.auth.signOut(); if(S.chan)sb.removeChannel(S.chan); S.me=null; showLogin(); break;
  }
});

/* ---------- 啟動 ---------- */
var rtTimer=null;
function scheduleRefresh(){clearTimeout(rtTimer);rtTimer=setTimeout(refresh,400);}
async function start(){
  var s=await sb.auth.getSession();var sess=s.data.session;
  if(!sess){showLogin();return;}
  try{
    await loadPeople();
    S.me=S.people[sess.user.id];
    if(!S.me||!S.me.active){await sb.auth.signOut();showLogin('這個帳號沒有店務本的使用權限');return;}
    await loadToday();
  }catch(e){showLogin(errMsg(e));return;}
  $('tabs').hidden=false;
  S.chan=sb.channel('ops').on('postgres_changes',{event:'*',schema:'public',table:'ops_routine_logs'},scheduleRefresh)
    .on('postgres_changes',{event:'*',schema:'public',table:'ops_tasks'},scheduleRefresh)
    .on('postgres_changes',{event:'*',schema:'public',table:'ops_events'},scheduleRefresh)
    .on('postgres_changes',{event:'*',schema:'public',table:'ops_notices'},scheduleRefresh)
    .on('postgres_changes',{event:'*',schema:'public',table:'ops_notice_reads'},scheduleRefresh)
    .on('postgres_changes',{event:'*',schema:'public',table:'ops_openings'},scheduleRefresh).subscribe();
  render();
}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&S.me)refresh();});
setInterval(function(){if(S.me&&tpeDate()!==S.today)refresh();},60000);
start();
})();
</script>
